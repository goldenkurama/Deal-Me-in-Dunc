name: CI and deploy

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to DigitalOcean
    needs: ci
    runs-on: ubuntu-latest

    if: >
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'

    steps:
      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail

          : "${DEPLOY_HOST:?DEPLOY_HOST secret is missing}"
          : "${DEPLOY_KEY:?DEPLOY_KEY secret is missing}"
          : "${DEPLOY_KNOWN_HOSTS:?DEPLOY_KNOWN_HOSTS secret is missing}"

          install -m 700 -d ~/.ssh

          printf '%s\n' "$DEPLOY_KEY" \
            | tr -d '\r' \
            > ~/.ssh/deploy_key

          chmod 600 ~/.ssh/deploy_key

          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" \
            | tr -d '\r' \
            > ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts

          test -s ~/.ssh/known_hosts

      - name: Deploy application
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail

          : "${DEPLOY_HOST:?DEPLOY_HOST secret is missing}"
          : "${DEPLOY_USER:?DEPLOY_USER secret is missing}"

          ssh \
            -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'bash -se' <<'REMOTE'
              set -euo pipefail

              export NVM_DIR="$HOME/.nvm"

              if [[ ! -s "$NVM_DIR/nvm.sh" ]]; then
                echo "NVM was not found for the deployment user."
                exit 1
              fi

              source "$NVM_DIR/nvm.sh"
              nvm use 22

              cd /var/www/deal-me-in-dunc

              git fetch origin main
              git reset --hard origin/main

              npm ci

              npm run build

              if ! command -v pm2 >/dev/null 2>&1; then
                echo "PM2 is not installed for the deployment user."
                exit 1
              fi

              if pm2 describe dealmeindunc-api >/dev/null 2>&1; then
                pm2 restart dealmeindunc-api --update-env
              else
                pm2 start apps/api/dist/index.js \
                  --name dealmeindunc-api \
                  --cwd /var/www/deal-me-in-dunc
              fi

              pm2 save

              curl \
                --fail \
                --silent \
                --show-error \
                --retry 10 \
                --retry-connrefused \
                --retry-delay 1 \
                http://127.0.0.1:3000/api/health

              echo
              echo "Deployment completed successfully."
          REMOTE
