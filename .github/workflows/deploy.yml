name: CI and deploy

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dealmeindunc-production
  cancel-in-progress: true

jobs:
  ci:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        shell: bash
        run: |
          if [[ -f package-lock.json ]]; then
            npm ci
          else
            npm install
          fi

      - name: Type-check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to DigitalOcean
    needs: ci
    runs-on: ubuntu-latest

    if: >
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'

    steps:
      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh

          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy application
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" 'bash -se' <<'REMOTE'
              set -euo pipefail

              export NVM_DIR="$HOME/.nvm"
              source "$NVM_DIR/nvm.sh"
              nvm use 22

              cd /var/www/deal-me-in-dunc

              git fetch origin main
              git reset --hard origin/main

              if [[ -f package-lock.json ]]; then
                npm ci
              else
                npm install
              fi

              npm run build

              if [[ -f .env ]]; then
                set -a
                source .env
                set +a
              fi

              if pm2 describe dealmeindunc-api >/dev/null 2>&1; then
                pm2 restart dealmeindunc-api --update-env
              else
                pm2 start npm \
                  --name dealmeindunc-api \
                  --cwd /var/www/deal-me-in-dunc \
                  -- run start --workspace=@fox-blackjack/api
              fi

              pm2 save
          REMOTE
